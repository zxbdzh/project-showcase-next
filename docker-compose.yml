# NAS 端只拉取 GHCR 镜像运行,不再本地构建(镜像由 GitHub Actions 在 ARM64 runner 构建)。
# 更新流程:git pull(取最新本文件) -> docker compose pull -> docker compose up -d
# 数据库结构同步改由 GitHub Actions 的 "DB Push" workflow 手动触发执行。
services:
  app:
    image: ghcr.io/zxbdzh/project-showcase-next:latest
    container_name: project-showcase-next
    env_file: .env
    ports:
      # 直接对外暴露 3000,可用 IP:3000 访问;nginx / HTTPS 自行配置(参考 deploy/nginx.conf)。
      # 若只想让宿主机 nginx 反代、不对公网开端口,改为 "127.0.0.1:3000:3000"。
      - "3000:3000"
    restart: unless-stopped
    pull_policy: always
