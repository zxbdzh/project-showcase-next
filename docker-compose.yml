services:
  app:
    build:
      context: .
      target: runner
      secrets:
        - dotenv
    image: project-showcase-next
    container_name: project-showcase-next
    env_file: .env
    ports:
      # 直接对外暴露 3000,可用 IP:3000 访问;nginx / HTTPS 自行配置(参考 deploy/nginx.conf)。
      # 若只想让宿主机 nginx 反代、不对公网开端口,改为 "127.0.0.1:3000:3000"。
      - "3000:3000"
    restart: unless-stopped

  # 同步数据库结构 / 灌示例数据。不随 `up` 启动,手动执行:
  #   docker compose run --rm migrate            # = pnpm db:push
  #   docker compose run --rm migrate pnpm db:seed
  migrate:
    build:
      context: .
      target: tools
      secrets:
        - dotenv
    image: project-showcase-next-tools
    env_file: .env
    profiles: ["tools"]
    command: ["pnpm", "db:push"]

secrets:
  dotenv:
    file: ./.env
