# 反向代理示例:放到宿主机 /etc/nginx/conf.d/project-showcase.conf
# 把 your-domain.com 换成你的域名,然后 `nginx -t && systemctl reload nginx`。

server {
    listen 80;
    server_name your-domain.com;

    # 图片走 S3 预签名直传,到应用的请求体很小;留点余量即可
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Auth.js 在反代后靠这些头识别真实协议/域名(配合 AUTH_TRUST_HOST=true)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # AI 流式响应:关闭缓冲,逐块实时透传
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}

# HTTPS:推荐用 certbot 自动签发并改写本文件
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.com
# 签发后 certbot 会注入 443 server 块与证书路径,并把 80 重定向到 443。
