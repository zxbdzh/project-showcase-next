name: Release Docker Image

# 在 GitHub 原生 ARM64 runner 上构建镜像并推送到 GHCR,NAS 端仅拉取运行。
# - public 仓库可免费使用 ubuntu-24.04-arm(原生 arm64,无需 QEMU,next build 正常速度)。
# - 整份生产 .env 由 secrets.PROD_DOTENV 注入,经 BuildKit secret 挂载,不写入镜像层;
#   其中 NEXT_PUBLIC_* 在构建时内联进客户端 bundle,DATABASE_URL 供 PPR 静态生成连库。

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 写入构建期 .env(BuildKit secret,不进镜像层)
        run: printf '%s\n' "$PROD_DOTENV" > .env
        env:
          PROD_DOTENV: ${{ secrets.PROD_DOTENV }}

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送(linux/arm64,目标 runner 阶段)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-files: |
            dotenv=./.env
          cache-from: type=gha
          cache-to: type=gha,mode=max
